<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="540" viewBox="0 0 1000 540">
  <title>Second shell of a rounded box</title>
  <g id="Layer_1" data-name="Layer 1">
    <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
    <text transform="matrix(1 0 0 1 50 42)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#000000"><tspan x="0" y="0">Second shell: hollow the existing 2 mm walls</tspan></text>
    <text transform="matrix(1 0 0 1 50 80)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">Local cross-section through a kept flat wall, away from corners and the opening.</tspan></text>
    <text transform="matrix(1 0 0 1 50 138)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000"><tspan x="0" y="0">Before</tspan></text>
    <rect x="330" y="110" width="400" height="110" fill="#dce9f5" stroke="#555555" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 530 170)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="0" y="0">2 mm material</tspan></text>
    <text transform="matrix(1 0 0 1 50 306)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000"><tspan x="0" y="0">Expected after</tspan></text>
    <rect x="330" y="270" width="100" height="110" fill="#dce9f5" stroke="#555555" stroke-miterlimit="10"/>
    <rect x="430" y="270" width="200" height="110" fill="#ffffff" stroke="#555555" stroke-miterlimit="10"/>
    <rect x="630" y="270" width="100" height="110" fill="#dce9f5" stroke="#555555" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 380 330)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="0" y="0">0.5 mm</tspan></text>
    <text transform="matrix(1 0 0 1 530 317)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="0" y="0">1 mm</tspan></text>
    <text transform="matrix(1 0 0 1 530 345)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="16" fill="#000000" text-anchor="middle"><tspan x="0" y="0">cavity</tspan></text>
    <text transform="matrix(1 0 0 1 680 330)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle"><tspan x="0" y="0">0.5 mm</tspan></text>
    <text transform="matrix(1 0 0 1 50 439)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="16" fill="#000000"><tspan x="0" y="0">The selected inner face opens the new cavity; the other faces move 0.5 mm into material.</tspan></text>
    <text transform="matrix(1 0 0 1 50 482)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1f6fb2"><tspan x="0" y="0">Whole part: one solid, original bounds, analytic material volume 9017.6 to 9038.3 mm3.</tspan></text>
  </g>
</svg>
